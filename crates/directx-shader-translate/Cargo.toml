[package]
name = "directx-shader-translate"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "DXBC (D3D9/10/11 shader bytecode) container parsing, as the front-end for a future DXBC/DXIL -> SPIR-V translator (open-directx Phase 1 vertical slice)."

[dependencies]
# コンテナ/チャンク解析そのものは既存の実装済みクレートを再利用する
# (車輪の再発明を避ける、CLAUDE.md方針)。RDEF/ISGN/OSGN/SHEX等の
# 標準チャンクをフルパースでき、fxc.exe出力での往復検証済み(2026-03公開、MIT)。
dxbc = "0.1.0"
thiserror = "1"

